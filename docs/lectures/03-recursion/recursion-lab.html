<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recursion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen classroom console. Code | call stack | picture, transport bar along the bottom. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #142033;
  --muted: #5a6679;
  --line: #d3d9e2;
  --accent: #c76a00;        /* the running line, the active frame: a highlighter */
  --accent-bg: #ffefcc;
  --wait: #3456c7;          /* paused frames */
  --wait-bg: #e6ecfc;
  --done: #23803a;          /* returned */
  --done-bg: #e2f4e6;
  --err: #c92a3a;
  --err-bg: #fde4e7;
  --hit: #0b7a8a;           /* memo lookup */
  --hit-bg: #dcf3f6;
  --kw: #8a2bb8; --str: #237a3a; --num: #b4520b; --com: #7b8798; --fn: #1d5fd0;
  --shadow: 0 1px 2px rgba(20,32,51,.06), 0 4px 14px rgba(20,32,51,.06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", Consolas, "Cascadia Mono", ui-monospace, monospace;
  --code-size: clamp(14px, 1.18vw, 21px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
    --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
    --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
    --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
  --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
  --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
  --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 10px;
  gap: 10px;
}
body, code, pre, .mono, svg text, input { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
code, pre, .mono { font-family: var(--f-code); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 22px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.picker { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 0; }
.picker select {
  flex: 1 1 auto; min-width: 0; max-width: 520px;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  font-size: 16px; font-weight: 700;
}
.top .tools { display: flex; gap: 6px; }

/* ---------- main grid ---------- */
main {
  flex: 1 1 auto; min-height: 0;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, .85fr) minmax(0, 1.1fr);
}
.pane {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
}
.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.pane-head .meta { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--f-code); font-size: 12px; }

/* ---------- code pane ---------- */
.about { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 4px; }
.about h1 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.about p { margin: 0; color: var(--muted); font-size: 14px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.badge.works { background: var(--done-bg); color: var(--done); }
.badge.wrong { background: var(--err-bg); color: var(--err); }
.badge.cost { background: var(--accent-bg); color: var(--accent); }
.badge.ex { background: var(--wait-bg); color: var(--wait); }

.callstrip {
  margin: 10px 14px 0; padding: 8px 10px; border-radius: 8px; background: var(--panel-2);
  font-family: var(--f-code); font-size: var(--code-size);
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
}
.callstrip .ps { color: var(--muted); margin-right: 6px; }
.callstrip input {
  font-family: var(--f-code); font-size: inherit; padding: 1px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--num);
  min-width: 2.5ch; field-sizing: content;
}
.callstrip input.bad { border-color: var(--err); background: var(--err-bg); }
.callstrip .run { margin-left: auto; }
.callerr { margin: 4px 14px 0; color: var(--err); font-size: 13px; min-height: 0; }

.code {
  margin: 10px 14px; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line);
  font-family: var(--f-code); font-size: var(--code-size); line-height: 1.6;
  overflow-x: auto; flex: 0 0 auto;
}
.ln { display: flex; align-items: center; min-width: max-content; padding-right: 10px; position: relative; }
.ln .no { width: 3ch; text-align: right; color: var(--com); padding-right: 12px; flex: 0 0 auto; user-select: none; }
.ln .src { white-space: pre; flex: 0 0 auto; }
.ln .tags { display: flex; gap: 4px; margin-left: 14px; flex: 0 0 auto; }
.ln .tag { font-family: var(--f-body); font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 1.6; }
.ln .tag.w { background: var(--wait-bg); color: var(--wait); }
.ln .tag.a { background: var(--accent); color: var(--panel); }
.ln .tag.r { background: var(--done); color: var(--panel); }
.ln .tag.e { background: var(--err); color: var(--panel); }
.ln.cur { background: var(--accent-bg); box-shadow: inset 4px 0 0 var(--accent); }
.ln.ret { background: var(--done-bg); box-shadow: inset 4px 0 0 var(--done); }
.ln.errl { background: var(--err-bg); box-shadow: inset 4px 0 0 var(--err); }
.ln.waitl { box-shadow: inset 4px 0 0 var(--wait); }
.t-kw { color: var(--kw); font-weight: 600; } .t-str { color: var(--str); } .t-num { color: var(--num); }
.t-com { color: var(--com); font-style: italic; } .t-fn { color: var(--fn); font-weight: 700; } .t-bi { color: var(--fn); }

.narr { margin: 0 14px 12px; flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.say { font-size: clamp(16px, 1.25vw, 21px); line-height: 1.45; max-width: 60ch; }
.say code, .qtext code, .choice code, .why code { font-size: .92em; background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.say.err { color: var(--err); }
.narr:has(.qcard) .say { font-size: clamp(14px, 1.05vw, 18px); }

/* question card */
.qcard { border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.qlabel { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.qtext { font-size: clamp(17px, 1.4vw, 23px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.choice {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer;
  font-size: clamp(14px, 1.05vw, 18px); line-height: 1.3;
}
.choice:hover { border-color: var(--accent); }
.choice .k { font-family: var(--f-code); font-weight: 700; color: var(--accent); flex: 0 0 auto; }
.choice.right { border-color: var(--done); background: var(--done-bg); }
.choice.wrong { border-color: var(--err); background: var(--err-bg); }
.choice[disabled] { cursor: default; }
.why { font-size: clamp(15px, 1.1vw, 19px); line-height: 1.45; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); }
.why b { color: var(--done); }
.qactions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- stack pane ---------- */
.stackwrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.limit { border: 1px dashed var(--err); border-radius: 8px; padding: 6px 10px; color: var(--err); font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
.limit .bar { height: 8px; border-radius: 4px; background: var(--err-bg); overflow: hidden; }
.limit .bar i { display: block; height: 100%; background: var(--err); transition: width .25s; }
.frame {
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel);
  display: flex; flex-direction: column; gap: 4px;
}
.frame .fh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.frame .fname { font-family: var(--f-code); font-weight: 700; font-size: clamp(14px, 1.05vw, 18px); overflow-wrap: anywhere; }
.frame .chip { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.frame .locals { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 10px; row-gap: 1px; font-family: var(--f-code); font-size: clamp(13px, .95vw, 16px); }
.frame .locals .k { color: var(--muted); }
.frame .locals .v { overflow-wrap: anywhere; }
.frame .locals .tmp { font-style: italic; }
.frame .locals .ref { color: var(--hit); }
.frame .fnote { font-size: 13px; color: var(--muted); }
.frame.active { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
.frame.active .chip { background: var(--accent); color: var(--panel); }
.frame.waiting { border-color: var(--wait); }
.frame.waiting .chip { background: var(--wait-bg); color: var(--wait); }
.frame.returning { border-color: var(--done); background: var(--done-bg); box-shadow: 0 0 0 1px var(--done); }
.frame.returning .chip { background: var(--done); color: var(--panel); }
.frame.error { border-color: var(--err); background: var(--err-bg); }
.frame.error .chip { background: var(--err); color: var(--panel); }
.frame.module { background: var(--panel-2); border-style: dashed; }
.frame.module .chip { background: var(--line); color: var(--muted); }
.frame.compact { padding: 3px 10px; flex-direction: row; align-items: center; justify-content: space-between; }
.frame.compact .fname { font-size: 13px; font-weight: 600; }
.frame.compact .locals, .frame.compact .fnote { display: none; }
.frame.new { animation: push .32s ease-out; }
@keyframes push { from { transform: translateY(-10px); opacity: .2; } to { transform: none; opacity: 1; } }
.stackfoot { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- picture pane ---------- */
.views { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.vlabel { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.vlabel .meta { text-transform: none; letter-spacing: 0; font-weight: 400; }
.treebox { overflow: auto; max-height: 100%; }
.treebox svg { display: block; max-width: 100%; height: auto; margin-inline: auto; }
svg text { font-family: var(--f-code); }
.tn rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; }
.tn text.l { fill: var(--ink); font-size: 13px; font-weight: 600; }
.tn text.r { fill: var(--done); font-size: 12.5px; font-weight: 700; }
.tn { cursor: pointer; }
.tn.active rect { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 3; }
.tn.wait rect { fill: var(--wait-bg); stroke: var(--wait); stroke-width: 2; }
.tn.done rect { fill: var(--done-bg); stroke: var(--done); }
.tn.hit rect { fill: var(--hit-bg); stroke: var(--hit); stroke-width: 2; stroke-dasharray: 5 3; }
.tn.hit text.r { fill: var(--hit); }
.tn.err rect { fill: var(--err-bg); stroke: var(--err); stroke-width: 2.5; }
.tn.err text.r { fill: var(--err); }
.tn.rep rect { stroke-dasharray: 6 3; }
.tn.rep.done rect { stroke: var(--err); stroke-width: 2.5; }
.tn text.rep { fill: var(--err); font-size: 11px; font-weight: 700; font-family: var(--f-body); }
.te { stroke: var(--line); stroke-width: 1.6; fill: none; }
.te.live { stroke: var(--wait); stroke-width: 2.6; }
.tn.fresh { animation: pop .3s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 2px solid; }

.cells { display: flex; gap: 4px; flex-wrap: wrap; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 46px; }
.cell .bx { width: 100%; text-align: center; font-family: var(--f-code); font-size: 18px; font-weight: 700; padding: 6px 4px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.cell .ix { font-family: var(--f-code); font-size: 12px; color: var(--muted); }
.cell .ptr { font-family: var(--f-code); font-size: 12px; font-weight: 700; min-height: 18px; display: flex; flex-direction: column; align-items: center; }
.cell .ptr .p { padding: 0 5px; border-radius: 4px; color: var(--wait); }
.cell .ptr .p.a { background: var(--accent); color: var(--panel); }
.cell.on .bx { border-color: var(--accent); background: var(--accent-bg); }
.cell.oob .bx { border-color: var(--err); background: var(--err-bg); color: var(--err); border-style: dashed; }
.cell.none .bx { color: var(--muted); font-weight: 400; font-size: 14px; }
.cell.set .bx { border-color: var(--done); background: var(--done-bg); }
.cell.hitc .bx { border-color: var(--hit); background: var(--hit-bg); }
.copies { display: flex; flex-direction: column; gap: 4px; }
.copyrow { display: flex; align-items: center; gap: 8px; }
.copyrow .lab { font-size: 12px; color: var(--muted); width: 9ch; flex: 0 0 auto; text-align: right; }
.copyrow .cells .cell { min-width: 34px; }
.copyrow .cells .bx { font-size: 14px; padding: 3px 2px; }
.copyrow.fresh .bx { border-color: var(--err); background: var(--err-bg); }
.bigstat { font-size: 15px; } .bigstat b { font-family: var(--f-code); font-size: 20px; }

.console { flex: 0 0 auto; border-top: 1px solid var(--line); display: flex; flex-direction: column; max-height: 38%; min-height: 90px; }
.out { margin: 0; padding: 8px 12px; overflow: auto; font-size: clamp(13px, .95vw, 16px); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; flex: 1 1 auto; }
.out .prompt { color: var(--muted); } .out .ret { color: var(--done); font-weight: 700; } .out .err { color: var(--err); } .out .print { color: var(--ink); }
.out .print.new, .out .ret.new { background: var(--accent-bg); }

/* ---------- transport ---------- */
.transport {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
  font-weight: 700; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.on { background: var(--wait-bg); border-color: var(--wait); color: var(--wait); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn kbd { font-family: var(--f-code); font-size: 11px; font-weight: 400; opacity: .75; }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.scrub { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 160px; }
.scrub input { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
.scrub .pos { font-family: var(--f-code); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--f-code); font-size: 15px; font-variant-numeric: tabular-nums; }
.speed { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.speed input { width: 90px; accent-color: var(--accent); }
.nudge { color: var(--err); font-size: 13px; font-weight: 700; }

@media (max-width: 1150px) {
  main { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: auto auto; }
  .views-pane { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .pane { max-height: none; }
  .stackwrap, .views { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) {
  .frame.new, .tn.fresh { animation: none; }
  .limit .bar i { transition: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Recursion Lab</b><span>DSA27 · Lecture 03</span></div>
  <div class="picker">
    <label for="scenario" class="mono" style="color:var(--muted);font-size:13px">Scenario</label>
    <select id="scenario"></select>
  </div>
  <div class="tools">
    <button class="btn" id="themeBtn" title="Switch light / dark">Theme</button>
    <button class="btn" id="fsBtn" title="Full screen (F)">Full screen</button>
  </div>
</header>

<main>
  <section class="pane code-pane">
    <div class="pane-head"><span>Code</span><span class="meta" id="lineInfo"></span></div>
    <div class="about">
      <div class="badges" id="badges"></div>
      <h1 id="scTitle"></h1>
      <p id="scBlurb"></p>
    </div>
    <div class="callstrip" id="callstrip"></div>
    <div class="callerr" id="callerr"></div>
    <div class="code" id="code"></div>
    <div class="narr" id="narr"></div>
  </section>

  <section class="pane stack-pane">
    <div class="pane-head"><span>Call stack</span><span class="meta" id="stackInfo"></span></div>
    <div class="stackwrap" id="stack"></div>
    <div class="stackfoot">Newest frame on top. Only the top frame runs; every frame below it is paused, waiting for the frame above it to return.</div>
  </section>

  <section class="pane views-pane">
    <div class="pane-head"><span id="viewTitle">Picture</span><span class="meta" id="viewMeta"></span></div>
    <div class="views" id="views"></div>
    <div class="console">
      <div class="pane-head"><span>Python shell</span></div>
      <pre class="out" id="out"></pre>
    </div>
  </section>
</main>

<footer class="transport">
  <div class="group">
    <button class="btn" id="bRestart" title="Back to the start (R)">Restart <kbd>R</kbd></button>
    <button class="btn" id="bBack" title="One step back (Left arrow)">Back <kbd>&larr;</kbd></button>
    <button class="btn primary" id="bStep" title="One step (Right arrow or Space)">Step <kbd>&rarr;</kbd></button>
    <button class="btn" id="bOver" title="Trust the recursion: run the next call to the end in one step (O)">Step over <kbd>O</kbd></button>
    <button class="btn" id="bOut" title="Finish this call and go back to its caller (U)">Step out <kbd>U</kbd></button>
    <button class="btn" id="bPlay" title="Play / pause (P)">Play <kbd>P</kbd></button>
  </div>
  <div class="speed"><label for="speed">Speed</label><input type="range" id="speed" min="1" max="10" value="5"></div>

<script>
/* =====================================================================
   ENGINE. Every scenario is a JavaScript mirror of the Python shown on
   screen. It runs once, and the Tracer records a snapshot at every step,
   so Back and the scrubber are just an index into that list.
   ===================================================================== */

class PyErr extends Error {
  constructor(type, msg, extra) { super(msg); this.type = type; this.extra = extra || {}; }
}

function pyrepr(v) {
  if (v === null || v === undefined) return 'None';
  if (typeof v === 'string') return "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
  if (typeof v === 'boolean') return v ? 'True' : 'False';
  if (typeof v === 'bigint') return v.toString();
  if (Array.isArray(v)) return '[' + v.map(pyrepr).join(', ') + ']';
  if (v && v.__ref) return v.__ref;
  return String(v);
}
const C = v => '`' + pyrepr(v) + '`';           // a value, as code, in a message
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const plural = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');

class Tracer {
  constructor(sc, callText) {
    this.sc = sc; this.limit = sc.limit || 0; this.callText = callText;
    this.codeLines = sc.code.split('\n');
    this.steps = []; this.nodes = []; this.ids = 0;
    this.out = [{ k: 'prompt', t: '>>> ' + callText }];
    this.counters = { calls: 0, maxDepth: 0 };
    for (const k in (sc.counters || {})) this.counters[k] = 0;
    this.extra = {};
    this.stack = [{ id: 0, fn: '<module>', label: '<module>', line: 0, locals: [], status: 'active', note: '>>> ' + callText, node: null }];
  }
  get top() { return this.stack[this.stack.length - 1]; }
  get depth() { return this.stack.length - 1; }

  snap(msg, kind) {
    if (this.steps.length > 4000) throw new Error('too many steps');
    this.steps.push(structuredClone({
      line: this.top.line, stack: this.stack, depth: this.depth,
      nodes: this.nodes.map(n => ({ s: n.status, r: n.ret, rep: n.rep, has: n.hasRet })),
      out: this.out, counters: this.counters, extra: this.extra,
      msg, kind: kind || '', q: null
    }));
    this.extra.flash = null;
  }
  set(name, val) {
    const L = this.top.locals, e = L.find(x => x[0] === name);
    if (e) e[1] = val; else L.push([name, val]);
  }
  at(line, msg) { const f = this.top; f.line = line; f.status = 'active'; this.snap(msg); }
  count(k, by) { this.counters[k] = (this.counters[k] || 0) + (by === undefined ? 1 : by); }
  print(text) { this.out.push({ k: 'print', t: text, fresh: true }); }

  /* A question about what happens NEXT, shown on the step just recorded. */
  ask(text, correct, distractors, why) {
    const seen = new Set([String(correct)]), opts = [String(correct)];
    for (const d of distractors) { const s = String(d); if (!seen.has(s) && opts.length < 4) { seen.add(s); opts.push(s); } }
    let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const order = opts.map((o, i) => [o, (h ^ (i * 2654435761)) >>> 0 ^ (i * 7919)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    this.steps[this.steps.length - 1].q = { text, choices: order, answer: order.indexOf(String(correct)), why };
  }

  call(fn, args, label, opt) {
    opt = opt || {};
    const caller = this.top;
    caller.status = 'waiting';
    caller.note = 'waiting for ' + label;
    caller.assign = opt.assign || null;
    if (opt.assign && caller.fn !== '<module>') this.set(opt.assign, { __ref: '?' });
    if (caller.node !== null) this.nodes[caller.node].status = 'wait';
    const node = { id: this.nodes.length, parent: caller.node, label, short: opt.short || label,
                   status: 'active', ret: null, hasRet: false, rep: false, at: this.steps.length };
    if (this.sc.repeats && this.nodes.some(n => n.label === label)) { node.rep = true; this.count('repeats'); }
    this.nodes.push(node);
    if (this.limit && this.depth >= this.limit) {
      node.status = 'err'; node.ret = 'too deep'; node.hasRet = true;
      throw new PyErr('RecursionError', 'maximum recursion depth exceeded', { deepCall: label });
    }
    const f = { id: ++this.ids, fn, label, line: 1, locals: args.map(a => [a[0], a[1]]), status: 'active', note: '', node: node.id };
    this.stack.push(f);
    this.count('calls');
    if (this.depth > this.counters.maxDepth) this.counters.maxDepth = this.depth;
    let msg = opt.msg;
    if (!msg) {
      const names = args.filter(a => !(a[1] && a[1].__ref)).map(a => '`' + a[0] + '`');
      msg = this.counters.calls <= 2
        ? `Call \`${label}\`. Python pushes a new frame on top of the stack. It has its own ${names.length ? names.join(' and ') : 'local variables'}, separate from every other frame.`
        : `Call \`${label}\`: push frame number ${this.depth}.`;
      if (node.rep) msg += ` This exact call happened before. Python does not remember the answer, so all of its work runs again.`;
    }
    this.snap(msg);
    return f;
  }

  ret(val, line, msg, opt) {
    opt = opt || {};
    const f = this.top;
    f.line = line; f.status = 'returning'; f.ret = val; f.implicit = !!opt.implicit;
    this.snap(msg || `Return ${C(val)}.`);
    const node = this.nodes[f.node];
    node.status = opt.hit ? 'hit' : 'done'; node.ret = val; node.hasRet = val !== null || !!opt.showNone;
    this.stack.pop();
    const c = this.top;
    c.status = 'active';
    const none = val === null || val === undefined;
    if (c.fn === '<module>') {
      if (!none) this.out.push({ k: 'ret', t: pyrepr(val), fresh: true });
      c.note = none ? 'finished' : 'result: ' + pyrepr(val);
      this.snap(`\`${f.label}\` is popped. Only \`<module>\` is left: the call is complete` +
                (none ? '.' : `, and the shell prints the answer, ${C(val)}.`));
    } else {
      if (c.assign) this.set(c.assign, val);
      c.note = none ? `${f.label} finished` : `${f.label} returned ${pyrepr(val)}`;
      this.snap(none
        ? `\`${f.label}\` is finished and popped. \`${c.label}\` wakes up and carries on from line ${c.line}.`
        : `\`${f.label}\` is popped, and its value ${C(val)} goes back to the frame below. \`${c.label}\` resumes at line ${c.line} with ${C(val)} in hand.`);
    }
    return val;
  }

  /* An exception: every frame on the stack is abandoned. */
  raise(e) {
    const frames = this.stack.slice(1);
    for (const f of frames) { f.status = 'error'; }
    this.top.note = `${e.type}: ${e.message}`;
    const tb = ['Traceback (most recent call last):', '  File "<stdin>", line 1, in <module>'];
    const entries = frames.map(f => ({ key: f.fn + ':' + f.line, text: `  File "demo.py", line ${f.line}, in ${f.fn}\n    ${(this.codeLines[f.line - 1] || '').trim()}` }));
    for (let i = 0; i < entries.length;) {
      let j = i; while (j < entries.length && entries[j].key === entries[i].key) j++;
      const run = j - i;
      for (let k = 0; k < Math.min(run, 3); k++) tb.push(entries[i].text);
      if (run > 3) tb.push(`  [Previous line repeated ${run - 3} more time${run - 3 === 1 ? '' : 's'}]`);
      i = j;
    }
    tb.push(`${e.type}: ${e.message}`);
    this.out.push({ k: 'err', t: tb.join('\n'), fresh: true });
    const first = e.type === 'RecursionError'
      ? `**RecursionError.** \`${e.extra.deepCall}\` would be frame ${this.depth + 1}, and the limit is ${this.limit}. (This demo stops at ${this.limit} so the stack fits on screen. Real Python stops at about 1,000.)`
      : `**${e.type}: ${e.message}.** ${e.extra.why || ''}`;
    this.snap(first + (this.sc.errWhy ? ' ' + this.sc.errWhy : ''), 'err');
    if (!this.sc.noErrQ) {
      this.ask('The error happened in the top frame. What happens to the paused frames below it?',
        'They are all abandoned: none of them finishes its work',
        ['Each one resumes and finishes with a default value', 'Only the frame just below is abandoned; the rest finish', 'Python retries the failed call once more'],
        'An exception unwinds the whole stack. Each paused frame is destroyed in the middle of its line, so its pending work (a multiplication, a comparison) never happens. Nobody gets a result.');
    }
    for (const f of frames) this.nodes[f.node].status = 'err';
    this.stack = [this.stack[0]];
    this.stack[0].status = 'error';
    this.stack[0].note = `${e.type}: no result`;
    this.stack[0].line = 0;
    this.snap(`The error unwinds the stack. All ${plural(frames.length, 'paused frame')} ${frames.length === 1 ? 'is' : 'are'} thrown away, and the shell prints a traceback instead of an answer.`, 'err');
  }

  move(disk, s, d) {
    const P = this.extra.pegs;
    P[s].pop(); P[d].push(disk);
    this.extra.flash = { disk, s, d };
    this.count('moves');
    this.print(`disk ${disk}: ${s} -> ${d}`);
  }
}

/* ---------------------------------------------------------------------
   Scenarios. `code` is exactly what students see. The mirror calls
   T.at(line, ...) with the line numbers of that code.
   --------------------------------------------------------------------- */
const SCENARIOS = [];
const def = sc => SCENARIOS.push(sc);
const GROUPS = {
  works: 'Recursion that works',
  cost: 'Same answer, very different cost',
  branch: 'Branching recursion',
  never: 'Goes wrong: never stops',
  crash: 'Goes wrong: crash or wrong answer',
  slow: 'Goes wrong: right answer, terrible cost',
};

/* ---- factorial, and factorial(-1) -------------------------------- */
function factorialMirror(T, n, top) {
  T.call('factorial', [['n', n]], `factorial(${n})`, { assign: 'factorial(n - 1)' });
  const neg = top < 0;
  if (n === top && !neg && n >= 1)
    T.ask(`How many \`factorial\` frames will be on the stack at the deepest point?`, n + 1, [n, n + 2, 1, 2 * n],
      `One frame for each of factorial(${n}), factorial(${n - 1}), …, factorial(0): that is ${n + 1}. None of them can return before the base case is reached.`);
  if (n === 0) T.at(2, `Is \`n == 0\`? \`n\` is 0: **yes**. This is the base case.`);
  else if (neg) T.at(2, `Is \`n == 0\`? \`n\` is ${n}: no.` + (n === top ? '' : ` It started below 0 and only gets smaller, so it will never be 0.`));
  else T.at(2, `Is \`n == 0\`? \`n\` is ${n}: no.`);
  if (n === top && neg)
    T.ask(`\`n\` is ${n}, not 0. What will \`factorial(${n})\` do?`,
      'Recurse for ever, until Python raises RecursionError',
      ['Return 1', `Return ${n}`, 'Return 0 after n passes 0'],
      `Each call subtracts 1: ${n}, ${n - 1}, ${n - 2}, … moves away from 0. Rule 2 is broken: the recursive case does not make progress towards the base case.`);
  if (n === 0) {
    if (top >= 1) T.ask(`\`factorial(0)\` is running. What happens next?`, 'It returns 1 straight away, without another call',
      ['It calls factorial(-1)', 'It returns 0', 'The paused frames below finish first'],
      'n == 0 is the base case. It answers directly, so the stack stops growing here, and the unwinding begins.');
    T.ret(1, 3, `Base case: return 1 directly. No new call, so the stack stops growing. Now it unwinds.`);
    return 1;
  }
  T.at(4, `To finish line 4, this frame needs \`factorial(${n - 1})\` first. It pauses in the middle of the line: \`${n} * ?\``);
  const r = factorialMirror(T, n - 1, top);
  if (n === 2 && top >= 2)
    T.ask(`\`factorial(2)\` just got ${C(r)} back. What does it return?`, 2, [1, 3, 4],
      'Line 4 can now finish: n * factorial(n - 1) = 2 * 1 = 2.');
  if (n === top && top >= 3)
    T.ask(`Only \`factorial(${n})\` is left. What does it return?`, n * r, [r, n * (n - 1), n + r],
      `It got factorial(${n - 1}) = ${r}, so it returns ${n} * ${r} = ${n * r}.`);
  return T.ret(n * r, 4, `Now the multiplication can happen: ${n} * ${r} = ${n * r}. Return it.`);
}
const FACT_CODE = `def factorial(n):
    if n == 0:
        return 1
    return n * factorial(n - 1)`;
def({
  id: 'factorial', group: 'works', title: 'factorial: winding and unwinding',
  blurb: 'Every call pushes a frame. Nothing is multiplied until the base case is reached; then each return pops a frame and hands its value down.',
  code: FACT_CODE, call: ['factorial(', 'n', ')'],
  params: { n: { type: 'int', def: 4, min: 0, max: 8 } },
  views: ['tree'],
  run: (T, p) => factorialMirror(T, p.n, p.n),
});

/* ---- to_binary --------------------------------------------------- */
function toBinaryMirror(T, n, top, st) {
  T.call('to_binary', [['n', n]], `to_binary(${n})`, { assign: 'to_binary(n // 2)' });
  if (n === top && n >= 4)
    T.ask(`The answer for ${n} has several binary digits. Which digit is produced by the DEEPEST frame?`,
      'The first (leftmost) digit', ['The last (rightmost) digit', 'A middle digit', 'No digit: the deepest frame returns nothing'],
      'The deepest frame has the smallest n, which is what is left after dividing by 2 many times: the leading digit. The digits are joined on the way back up, so they come out in the right order.');
  T.at(2, n < 2 ? `Is \`n < 2\`? \`n\` is ${n}: **yes**, a single binary digit.` : `Is \`n < 2\`? \`n\` is ${n}: no.`);
  if (n < 2) return T.ret(String(n), 3, `Base case: return ${C(String(n))}.`);
  T.at(4, `First the leading digits: \`to_binary(${n} // 2)\` = \`to_binary(${Math.floor(n / 2)})\`. The last digit, \`${n} % 2\` = ${n % 2}, has to wait.`);
  const r = toBinaryMirror(T, Math.floor(n / 2), top, st);
  const res = r + String(n % 2);
  if (!st.asked && r.length >= 2) {
    st.asked = true;
    T.ask(`\`to_binary(${n})\` got ${C(r)} back. What does it return?`, pyrepr(res),
      [pyrepr(String(n % 2) + r), pyrepr(r), pyrepr(r + String(1 - n % 2))],
      `Its last digit is ${n} % 2 = ${n % 2}, appended after the leading digits: ${pyrepr(r)} + ${pyrepr(String(n % 2))} = ${pyrepr(res)}.`);
  }
  return T.ret(res, 4, `Join on the way back up: ${C(r)} + ${C(String(n % 2))} = ${C(res)}.`);
}
def({
  id: 'to_binary', group: 'works', title: 'to_binary: work done on the way back up',
  blurb: 'The recursive call builds the leading digits; the current call appends the last one, during unwinding.',
  code: `def to_binary(n):
    if n < 2:
        return str(n)
    return to_binary(n // 2) + str(n % 2)`,
  call: ['to_binary(', 'n', ')'],
  params: { n: { type: 'int', def: 13, min: 0, max: 1000 } },
  views: ['tree'],
  run: (T, p) => toBinaryMirror(T, p.n, p.n, {}),
});

/* ---- array_max, correct and off by one --------------------------- */
function arrayMaxMirror(T, arr, i, buggy, st) {
  T.call('array_max', [['arr', { __ref: 'the same array' }], ['i', i]], `array_max(arr, ${i})`, { assign: 'rest' });
  const last = buggy ? arr.length : arr.length - 1;
  const test = buggy ? 'len(arr)' : 'len(arr) - 1';
  T.at(2, `Is \`i == ${test}\`? \`i\` is ${i}, \`${test}\` is ${last}: ${i === last ? '**yes**' : 'no'}.`);
  if (i === last) {
    if (i >= arr.length) {
      T.ask(`\`i\` is ${i} and the array has ${arr.length} elements. What happens on line 3?`,
        'IndexError: there is no element at index ' + i,
        [`It returns the last element, ${arr[arr.length - 1]}`, 'It returns None', 'It returns 0'],
        `The valid indices are 0 to ${arr.length - 1}. The base case fires one step too late.`);
      T.at(3, `\`arr[${i}]\`: but the valid indices are 0 to ${arr.length - 1}.`);
      throw new PyErr('IndexError', 'list index out of range', { why: `The base case tests \`i == len(arr)\`, one step past the last element. It should be \`i == len(arr) - 1\`.` });
    }
    return T.ret(arr[i], 3, `One element left: return \`arr[${i}]\` = ${arr[i]}.`);
  }
  T.at(4, `The answer for the rest: \`array_max(arr, ${i + 1})\`. The array is not copied. Only \`i\` moves.`);
  const rest = arrayMaxMirror(T, arr, i + 1, buggy, st);
  const res = arr[i] > rest ? arr[i] : rest;
  if (!st.asked && i <= arr.length - 3) {
    st.asked = true;
    T.ask(`This frame has \`arr[${i}]\` = ${arr[i]} and \`rest\` = ${rest}. What does it return?`, res,
      [arr[i] > rest ? rest : arr[i], arr[i] + rest, arr[arr.length - 1]],
      `Line 5 returns the larger of the two: ${res}.`);
  }
  return T.ret(res, 5, `Compare \`arr[${i}]\` = ${arr[i]} with \`rest\` = ${rest}: return ${res}.`);
}
const numList = (min, max) => ({ type: 'list', minLen: min, maxLen: max, check: v => v.every(x => typeof x === 'number') || 'Use numbers only.' });
def({
  id: 'array_max', group: 'works', title: 'array_max: move an index, not the data',
  blurb: 'Every frame shares the same array. Each one owns a different i.',
  code: `def array_max(arr, i=0):
    if i == len(arr) - 1:
        return arr[i]
    rest = array_max(arr, i + 1)
    return arr[i] if arr[i] > rest else rest`,
  call: ['array_max(', 'arr', ')'],
  params: { arr: Object.assign(numList(1, 9), { def: [3, 8, 2, 9, 4] }) },
  views: ['array', 'tree'],
  setup: (T, p) => { T.extra.arr = p.arr; T.extra.oob = false; },
  run: (T, p) => arrayMaxMirror(T, p.arr, 0, false, {}),
});

/* ---- depth of nested lists ------------------------------------- */
function depthMirror(T, x, st) {
  T.call('depth', [['nested', x]], `depth(${pyrepr(x)})`, { assign: 'd', short: clip(`depth(${pyrepr(x)})`, 18) });
  if (!st.started) {
    st.started = true;
    T.ask(`What will \`depth(${pyrepr(x)})\` return?`, st.answer, [st.answer - 1, st.answer + 1, st.answer + 2, 1],
      'Count the brackets on the way down: each list adds 1 to the depth of its deepest item; a plain value has depth 0.');
  }
  const isList = Array.isArray(x);
  T.at(2, isList ? `${C(x)} is a list: keep going.` : `${C(x)} is not a list.`);
  if (!isList) return T.ret(0, 3, `A plain value has depth 0.`);
  let deepest = 0;
  T.set('deepest', 0); T.at(4, `\`deepest = 0\`: nothing seen yet.`);
  for (const item of x) {
    T.set('item', item);
    T.at(5, `Next item: ${C(item)}. Ask the recursion for its depth.`);
    T.at(6, `\`depth(${pyrepr(item)})\`: this frame waits on line 6.`);
    const d = depthMirror(T, item, st);
    T.at(7, `Is \`d\` = ${d} bigger than \`deepest\` = ${deepest}? ${d > deepest ? 'Yes.' : 'No.'}`);
    if (d > deepest) { deepest = d; T.set('deepest', d); T.at(8, `\`deepest = ${d}\`.`); }
  }
  T.set('item', { __ref: '(loop over)' });
  return T.ret(1 + deepest, 9, `The loop is done. One level for this list, plus the deepest item: 1 + ${deepest} = ${1 + deepest}.`);
}
function depthOf(x) { if (!Array.isArray(x)) return 0; let d = 0; for (const i of x) d = Math.max(d, depthOf(i)); return 1 + d; }
function countNodes(x) { return Array.isArray(x) ? 1 + x.reduce((s, i) => s + countNodes(i), 0) : 1; }
def({
  id: 'depth', group: 'works', title: 'depth: the data itself is recursive',
  blurb: 'A list whose items may be lists. One call per nested piece, with a loop inside each call.',
  code: `def depth(nested):
    if not isinstance(nested, list):
        return 0
    deepest = 0
    for item in nested:
        d = depth(item)
        if d > deepest:
            deepest = d
    return 1 + deepest`,
  call: ['depth(', 'nested', ')'],
  params: { nested: { type: 'list', def: [1, [2, [3]], [4]], minLen: 0, maxLen: 6,
                      check: v => countNodes(v) <= 16 || 'Keep it to 16 values and lists in total.' } },
  views: ['tree'],
  run: (T, p) => depthMirror(T, p.nested, { answer: depthOf(p.nested) }),
});

/* ---- fib, naive ---------------------------------------------------- */
const fibv = n => { let a = 0, b = 1; for (let i = 0; i < n; i++) [a, b] = [b, a + b]; return a; };
function fibMirror(T, n, st) {
  T.call('fib', [['n', n]], `fib(${n})`, { assign: st.second ? 'fib(n - 2)' : 'fib(n - 1)' });
  const node = T.nodes[T.nodes.length - 1];
  if (!st.started) {
    st.started = true;
    const calls = 2 * fibv(n + 1) - 1;
    if (n >= 3) T.ask(`How many calls to \`fib\` will \`fib(${n})\` make in total, counting this one?`, calls,
      [n, 2 * n - 1, Math.pow(2, n) - 1, fibv(n)],
      `Count the nodes of the finished tree: ${calls}. In general fib(n) makes 2·fib(n+1) − 1 calls, which grows like 1.618ⁿ.`);
  } else if (node.rep && !st.askedRep && n >= 2) {
    st.askedRep = true;
    T.ask(`\`fib(${n})\` was already computed earlier in this run. What does Python do now?`,
      'Computes it again from scratch, with its whole subtree',
      ['Reuses the answer it computed before', 'Skips it and uses 0', 'Raises an error for the repeated call'],
      'A plain function has no memory between calls. Every repeat rebuilds the same subtree. That waste is why naive fib is exponential.');
  }
  T.at(2, n < 2 ? `Is \`n < 2\`? \`n\` is ${n}: **yes**.` : `Is \`n < 2\`? \`n\` is ${n}: no.`);
  if (n < 2) {
    if (!st.askedPath && st.top >= 4 && T.depth >= 3) {
      st.askedPath = true;
      T.ask('Look at the tree. Which calls are on the call stack right now?',
        'Exactly the path from the root down to the active node',
        ['Every node drawn so far', 'Only the nodes that have returned', 'Only the active node'],
        'The stack holds the calls that have started and not yet finished: the root, its child, …, down to the active call. Finished nodes have already been popped.');
    }
    return T.ret(n, 3, `Base case: \`fib(${n})\` = ${n}.`);
  }
  T.at(4, `Line 4 makes **two** calls. First \`fib(${n - 1})\`; the \`+ fib(${n - 2})\` has to wait.`);
  st.second = false;
  const a = fibMirror(T, n - 1, st);
  st.second = true;

function fibMemoMirror(T, n, memo, st) {

      [2 * fibv(n + 1) - 1, n, n * n, n + 1],
      `fib_memo(k) does the real work once for each k from ${n} down to 2, and each of those also makes one quick call that returns at once: ${2 * n - 1} = 2n − 1 calls. Linear.`);
  }
  T.at(2, memo ? `\`memo\` is not None: it is the shared Array, passed down. Skip line 3.` : `\`memo is None\`: this is the first, outside call.`);
  if (!memo) {

    T.at(3, `Create \`memo = Array(${n + 1})\`, all None. Every call below receives this same Array; nobody copies it.`);
  }
  T.at(4, n < 2 ? `Is \`n < 2\`? \`n\` is ${n}: **yes**.` : `Is \`n < 2\`? \`n\` is ${n}: no.`);
  if (n < 2) return T.ret(n, 5, `Base case: return ${n}.`);
  if (memo[n] !== null) {
    T.extra.flash = { k: n, kind: 'hit' }; T.count('hits');
    T.at(6, `Is \`memo[${n}]\` None? No, it holds ${memo[n]}. It was computed earlier, so skip line 7.`);
    if (!st.askedHit) {
      st.askedHit = true;
      T.ask(`\`memo[${n}]\` already holds ${memo[n]}. What happens now?`, `Line 8 returns ${memo[n]} at once: no new calls`,
        [`fib_memo(${n - 1}) and fib_memo(${n - 2}) are called again`, 'memo[' + n + '] is recomputed to check it', 'It returns None'],
        'That is the whole point of memoisation: compute each answer once, then look it up. The tree stops growing here.');
    }
    return T.ret(memo[n], 8, `Look it up: return \`memo[${n}]\` = ${memo[n]}.`, { hit: true });
  }
  T.at(6, `Is \`memo[${n}]\` None? Yes: not computed yet.`);
  T.at(7, `Compute it once: first \`fib_memo(${n - 1}, memo)\`.`);
  st.second = false;
  const a = fibMemoMirror(T, n - 1, memo, st);
  st.second = true;
  const b = fibMemoMirror(T, n - 2, memo, st);
  st.second = false;
  memo[n] = a + b; T.extra.flash = { k: n, kind: 'set' };

}

/* ---- power, fast ---------------------------------------------------- */

      `n halves each call: ${(() => { const s = []; let k = n; while (k > 0) { s.push(k); k = Math.floor(k / 2); } s.push(0); return s.join(' → '); })()}. That is ${powerFastCalls(n)} calls, about log₂ n.`);

function bsMirror(T, n, bad, top, st) {

        return arr[i]
    rest = array_max(arr, i + 1)
    return arr[i] if arr[i] > rest else rest`,
  call: ['array_max(', 'arr', ')'],
  params: { arr: Object.assign(numList(1, 9), { def: [3, 8, 2, 9, 4] }) },
  views: ['array', 'tree'],
  setup: (T, p) => { T.extra.arr = p.arr; T.extra.oob = true; },
  run: (T, p) => {
    T.snap(`Read the code before you step. Which line is wrong?`);
    T.ask(`What will \`array_max(${pyrepr(p.arr)})\` do?`, 'Crash with IndexError',
      [`Return ${Math.max(...p.arr)}`, `Return ${p.arr[p.arr.length - 1]}`, 'Recurse for ever: RecursionError'],
      `Line 2 stops at \`i == len(arr)\`, which is one index past the end, and line 3 then reads \`arr[${p.arr.length}]\`.`);

});
def({

/* ---- goes wrong: terrible cost ------------------------------------ */
function trapCalls(n) { return n === 0 ? 1 : 1 + 2 * trapCalls(Math.floor(n / 2)); }
function powerTrapMirror(T, x, n, top, st) {
  T.call('power', [['x', x], ['n', n]], `power(${x}, ${n})`, { assign: st.second ? 'second' : 'first' });
  const node = T.nodes[T.nodes.length - 1];
  if (n === top && T.depth === 1 && n >= 2)
    T.ask(`The fast version makes ${powerFastCalls(n)} calls for n = ${n}. How many does this one make?`, trapCalls(n),
      [powerFastCalls(n), 2 * powerFastCalls(n), n],
      `Two calls on n // 2 at every level: T(n) = 2T(n/2) + c, which is O(n). Here ${trapCalls(n)} calls. All the gain from halving is lost.`);
  else if (node.rep && !st.askedRep && n >= 1) {
    st.askedRep = true;
    T.ask(`\`power(${x}, ${n})\` was computed a moment ago, by the first call on the same line. What happens now?`,
      'It is computed again from scratch, with all of its calls', ['Python reuses the first result', 'The second call is skipped', 'It returns 1'],
      'Writing the same call twice runs it twice. Call once, keep the result in a variable (half), and square the variable.');
  }
  T.at(2, n === 0 ? `Is \`n == 0\`? **Yes**.` : `Is \`n == 0\`? \`n\` is ${n}: no.`);
  if (n === 0) return T.ret(1n, 3, 'x⁰ = 1.');
  const L = n % 2 === 0 ? 5 : 6;
  T.at(4, `Is n even? \`${n} % 2\` = ${n % 2}: ${n % 2 === 0 ? 'yes, go to line 5' : 'no, go to line 6'}.`);
  T.at(L, `Line ${L} calls \`power(${x}, ${Math.floor(n / 2)})\`… and then calls it **again**.`);
  st.second = false;
  const a = powerTrapMirror(T, x, Math.floor(n / 2), top, st);
  st.second = true;
  const b = powerTrapMirror(T, x, Math.floor(n / 2), top, st);
  st.second = false;
  const res = n % 2 === 0 ? a * b : a * b * BigInt(x);
  return T.ret(res, L, n % 2 === 0 ? `${a} * ${b} = ${res}.` : `${a} * ${b} * ${x} = ${res}.`);
}
def({
  id: 'power_trap', group: 'slow', title: 'power: the same call written twice',
  blurb: 'Correct answer. But two calls on n // 2 per frame build a full tree, and the log n speed is gone.',
  code: `def power(x, n):
    if n == 0:
        return 1
    if n % 2 == 0:
        return power(x, n // 2) * power(x, n // 2)
    return power(x, n // 2) * power(x, n // 2) * x`,
  call: ['power(', 'x', ', ', 'n', ')'],
  params: { x: { type: 'int', def: 2, min: -9, max: 9 }, n: { type: 'int', def: 13, min: 0, max: 16 } },
  views: ['tree'], repeats: true, counters: { repeats: 'Repeated calls' },
  run: (T, p) => powerTrapMirror(T, p.x, p.n, p.n, {}),
  summary: (T, v, p) => ` ${T.counters.calls} calls, where the fast version needs ${powerFastCalls(p.n)}.`,
});
function listMaxMirror(T, values, st) {
  T.call('list_max', [['values', values]], `list_max(${pyrepr(values)})`, { assign: 'rest', short: clip(`list_max(${pyrepr(values)})`, 20) });
  if (!st.started) {
    st.started = true;
    const k = values.length;
    if (k >= 3) T.ask(`The answer will be right. How many list elements will the slices copy in total, for ${k} elements?`, k * (k - 1) / 2,
      [0, k - 1, k, k * k],
      `Each slice copies everything after the first element: ${Array.from({ length: k - 1 }, (_, i) => k - 1 - i).join(' + ')} = ${k * (k - 1) / 2}. That is n(n − 1)/2: O(n²) work hidden inside an O(n)-looking recursion.`);
  }
  T.at(2, `Is \`len(values) == 1\`? \`len(values)\` is ${values.length}: ${values.length === 1 ? '**yes**' : 'no'}.`);
  if (values.length === 1) return T.ret(values[0], 3, `One element: return ${values[0]}.`);
  const copy = values.slice(1);
  T.count('copied', copy.length);
  T.extra.copies.push(copy); T.extra.flash = { k: T.extra.copies.length - 1 };
  T.at(4, `\`values[1:]\` builds a **new** list: ${plural(copy.length, 'element')} copied before the call even starts.`);
  const rest = listMaxMirror(T, copy, st);
  const res = values[0] > rest ? values[0] : rest;
  return T.ret(res, 5, `Compare \`values[0]\` = ${values[0]} with \`rest\` = ${rest}: return ${res}.`);
}
def({
  id: 'list_slice', group: 'slow', title: 'list_max with slices: hidden O(n²)',
  blurb: 'Same idea as array_max, but values[1:] copies the rest of the list on every call. Compare with the array_max scenario.',
  code: `def list_max(values):
    if len(values) == 1:
        return values[0]
    rest = list_max(values[1:])
    return values[0] if values[0] > rest else rest`,
  call: ['list_max(', 'values', ')'],
  params: { values: Object.assign(numList(1, 9), { def: [3, 8, 2, 9, 4, 7] }) },
  views: ['copies', 'tree'], counters: { copied: 'Elements copied' },
  setup: (T, p) => { T.extra.copies = [p.values.slice()]; },
  run: (T, p) => listMaxMirror(T, p.values, {}),
  summary: (T, v, p) => ` ${T.counters.copied} elements copied. array_max on the same data copies none.`,

/* Build the full trace for one scenario and its inputs. */
function callText(sc, p) {
  return sc.call.map(part => (part in (sc.params || {})) ? pyrepr(p[part]) : part).join('');
}
function build(sc, p) {
  const T = new Tracer(sc, callText(sc, p));
  if (sc.setup) sc.setup(T, p);
  T.snap(`Ready. Press **Step** to run \`${T.callText}\`. The shell is the bottom frame, \`<module>\`.`);
  try {
    const v = sc.run(T, p);
    if (sc.summary) T.steps[T.steps.length - 1].msg += sc.summary(T, v, p);
    else T.steps[T.steps.length - 1].msg += ` ${plural(T.counters.calls, 'call')}; at most ${plural(T.counters.maxDepth, 'frame')} on the stack at once.`;
  } catch (e) {
    if (e instanceof PyErr) T.raise(e); else throw e;
  }
  return T;
}

/* =====================================================================
   UI
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');

const KW = new Set(['def', 'if', 'return', 'for', 'in', 'not', 'is', 'None', 'else', 'and', 'or', 'True', 'False', 'while']);
const BI = new Set(['print', 'len', 'str', 'isinstance', 'list', 'int', 'Array']);
function highlight(line) {
  const re = /(#.*$)|([fF]?"(?:[^"\\]|\\.)*"|[fF]?'(?:[^'\\]|\\.)*')|(\b\d+\b)|([A-Za-z_]\w*)|(\s+|.)/g;
  let m, html = '', prev = '';
  while ((m = re.exec(line))) {
    if (m[1]) html += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) html += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) html += `<span class="t-num">${m[3]}</span>`;
    else if (m[4]) {
      const w = m[4];
      if (prev === 'def') html += `<span class="t-fn">${w}</span>`;
      else if (KW.has(w)) html += `<span class="t-kw">${w}</span>`;
      else if (BI.has(w)) html += `<span class="t-bi">${w}</span>`;
      else html += esc(w);
      prev = w; continue;
    } else html += esc(m[5]);
    if (m[5] && /\S/.test(m[5])) prev = m[5];
  }
  return html;
}

const state = { sc: null, params: {}, T: null, idx: 0, answered: new Map(), quiz: true, timer: null, prevSnap: null, nudge: '' };

function initPicker() {
  const sel = $('scenario');
  for (const g in GROUPS) {
    const og = document.createElement('optgroup'); og.label = GROUPS[g];
    for (const sc of SCENARIOS.filter(s => s.group === g)) {
      const o = document.createElement('option'); o.value = sc.id; o.textContent = sc.title + (sc.exercise ? '  (exercise solution)' : '');
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.addEventListener('change', () => loadScenario(sel.value));
}

function loadScenario(id) {
  stop();
  const sc = SCENARIOS.find(s => s.id === id) || SCENARIOS[0];
  state.sc = sc;
  $('scenario').value = sc.id;
  state.params = {};
  for (const k in sc.params) state.params[k] = structuredClone(sc.params[k].def);
  const kind = ['never', 'crash', 'slow'].includes(sc.group) ? 'wrong' : sc.group === 'cost' ? 'cost' : 'works';
  $('badges').innerHTML = `<span class="badge ${kind}">${esc(GROUPS[sc.group])}</span>` + (sc.exercise ? `<span class="badge ex">Shows an exercise solution</span>` : '') +
    (sc.limit ? `<span class="badge wrong">Demo limit: ${sc.limit} frames</span>` : '');
  $('scTitle').textContent = sc.title;
  $('scBlurb').textContent = sc.blurb;
  renderCallStrip();
  rebuild();
  try { localStorage.setItem('recursion-lab-scenario', sc.id); } catch (e) {}
}

function renderCallStrip() {
  const sc = state.sc, box = $('callstrip');
  box.innerHTML = '<span class="ps">&gt;&gt;&gt;</span>';
  for (const part of sc.call) {
    if (part in sc.params) {
      const inp = document.createElement('input');
      inp.id = 'param-' + part; inp.value = pyrepr(state.params[part]); inp.spellcheck = false;
      inp.setAttribute('aria-label', part);
      inp.size = Math.max(2, inp.value.length);
      inp.addEventListener('input', () => { inp.size = Math.max(2, inp.value.length); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyParams(); } e.stopPropagation(); });
      inp.addEventListener('change', applyParams);
      box.appendChild(inp);
    } else {
      const s = document.createElement('span'); s.innerHTML = highlight(part); box.appendChild(s);
    }
  }
  const run = document.createElement('button'); run.className = 'btn run'; run.textContent = 'Run';
  run.addEventListener('click', applyParams); box.appendChild(run);
}

function parsePy(text) {
  const j = text.trim().replace(/'/g, '"').replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false');
  return JSON.parse(j);
}
function applyParams() {
  const sc = state.sc, next = {}; let err = '';
  for (const k in sc.params) {
    const spec = sc.params[k], inp = $('param-' + k);
    inp.classList.remove('bad');
    try {
      if (spec.type === 'int') {
        if (!/^\s*-?\d+\s*$/.test(inp.value)) throw new Error(`${k} must be a whole number.`);
        const v = parseInt(inp.value, 10);
        if (v < spec.min || v > spec.max) throw new Error(`For this demo, ${k} must be between ${spec.min} and ${spec.max}.`);
        next[k] = v;
      } else {
        let v; try { v = parsePy(inp.value); } catch (e) { throw new Error(`${k} must be a Python list, like ${pyrepr(spec.def)}.`); }
        if (!Array.isArray(v)) throw new Error(`${k} must be a list.`);
        if (v.length < spec.minLen || v.length > spec.maxLen) throw new Error(`${k} must have ${spec.minLen} to ${spec.maxLen} items.`);
        const ok = spec.check ? spec.check(v) : true;
        if (ok !== true) throw new Error(ok);
        next[k] = v;
      }
    } catch (e) { inp.classList.add('bad'); err = e.message; }
  }
  $('callerr').textContent = err;
  if (err) return;
  state.params = next;
  for (const k in next) { const inp = $('param-' + k); inp.value = pyrepr(next[k]); inp.size = Math.max(2, inp.value.length); }
  rebuild();
}

function rebuild() {
  stop();
  state.T = build(state.sc, state.params);
  state.idx = 0; state.answered = new Map(); state.prevSnap = null;
  state.layout = layoutTree(state.T.nodes);
  $('scrub').max = state.T.steps.length - 1;
  render();
}

/* ---------- navigation ---------- */
const snapAt = i => state.T.steps[i];
const pendingQ = () => { const s = snapAt(state.idx); return state.quiz && s.q && !state.answered.has(state.idx); };
function go(i, opts) {
  opts = opts || {};
  const N = state.T.steps.length;
  i = Math.max(0, Math.min(N - 1, i));
  if (i === state.idx) return false;
  state.prevSnap = snapAt(state.idx);
  state.idx = i;
  state.nudge = '';
  render(opts);
  return true;
}
function guard() {
  if (pendingQ()) { state.nudge = 'Answer the question first (keys A–D), or press Reveal.'; $('nudge').textContent = state.nudge; return false; }
  return true;
}
function step() { if (!guard()) { stop(); return false; } return go(state.idx + 1); }
function back() { stop(); go(state.idx - 1); }
function stepOver() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, d = S[state.idx].depth;
  let j = state.idx + 1;
  if (j < S.length && S[j].depth > d) { while (j < S.length && S[j].depth > d) j++; }
  go(j);
}
function stepOut() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, d = S[state.idx].depth;
  let j = state.idx + 1;
  while (j < S.length && S[j].depth >= d && d > 0) j++;
  go(j);
}
function play() {
  if (state.timer) { stop(); return; }
  if (state.idx >= state.T.steps.length - 1) go(0);
  $('bPlay').innerHTML = 'Pause <kbd>P</kbd>'; $('bPlay').classList.add('on');
  const tick = () => {
    if (!step() || state.idx >= state.T.steps.length - 1 || pendingQ()) { stop(); return; }
    state.timer = setTimeout(tick, delay());
  };
  state.timer = setTimeout(tick, Math.min(400, delay()));
}
function stop() {
  if (state.timer) clearTimeout(state.timer);
  state.timer = null;
  $('bPlay').innerHTML = 'Play <kbd>P</kbd>'; $('bPlay').classList.remove('on');
}
const delay = () => [2600, 2000, 1500, 1150, 900, 700, 520, 380, 260, 160][+$('speed').value - 1];

function answer(k) {
  const s = snapAt(state.idx);
  if (!s.q || state.answered.has(state.idx)) return;
  state.answered.set(state.idx, k);
  state.nudge = '';
  renderNarr();
  $('nudge').textContent = '';
}

/* ---------- rendering ---------- */
function render(opts) {
  const s = snapAt(state.idx);
  renderCode(s);
  renderNarr();
  renderStack(s);
  renderViews(s);
  renderOut(s);
  renderTransport(s);
}

function renderCode(s) {
  const lines = state.sc.code.split('\n');
  const frames = s.stack.slice(1), top = s.stack[s.stack.length - 1];
  const waiting = {};
  for (const f of frames) if (f !== top || top.status === 'error') if (f.status === 'waiting') (waiting[f.line] = waiting[f.line] || []).push(f);
  const errLine = s.kind === 'err' && frames.length ? frames[frames.length - 1].line : 0;
  let html = '';
  lines.forEach((ln, i) => {
    const no = i + 1;
    let cls = '';
    const tags = [];
    if (top.fn !== '<module>' && top.line === no) {
      if (top.status === 'returning') { cls = 'ret'; tags.push(`<span class="tag r">returns ${esc(clip(pyrepr(top.ret), 22))}</span>`); }
      else if (top.status === 'error') { cls = 'errl'; tags.push(`<span class="tag e">error here</span>`); }
      else { cls = 'cur'; tags.push(`<span class="tag a">${esc(clip(top.label, 26))}</span>`); }
    } else if (errLine === no) cls = 'errl';
    if (waiting[no]) { if (!cls) cls = 'waitl'; tags.push(`<span class="tag w">${waiting[no].length === 1 ? esc(clip(waiting[no][0].label, 24)) + ' paused' : waiting[no].length + ' paused'}</span>`); }
    html += `<div class="ln ${cls}"><span class="no">${no}</span><span class="src">${highlight(ln) || ' '}</span><span class="tags">${tags.join('')}</span></div>`;
  });
  $('code').innerHTML = html;
  $('lineInfo').textContent = top.fn === '<module>' ? '' : `${top.label} · line ${top.line}`;
}

function renderNarr() {
  const s = snapAt(state.idx), box = $('narr');
  let html = `<div class="say ${s.kind === 'err' ? 'err' : ''}">${md(s.msg)}</div>`;
  if (s.q && state.quiz) {
    const chosen = state.answered.get(state.idx);
    const done = chosen !== undefined;
    html += `<div class="qcard" role="group" aria-label="Question"><div class="qlabel">What happens next?</div><div class="qtext">${md(s.q.text)}</div><div class="choices">`;
    s.q.choices.forEach((c, k) => {
      let cls = '';
      if (done) { if (k === s.q.answer) cls = 'right'; else if (k === chosen) cls = 'wrong'; }
      html += `<button class="choice ${cls}" data-k="${k}" ${done ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span>${md(c)}</span></button>`;
    });
    html += `</div>`;
    if (done) {
      const verdict = chosen === -1 ? 'Answer:' : chosen === s.q.answer ? 'Correct.' : `Not quite. The answer is ${'ABCD'[s.q.answer]}.`;
      html += `<div class="why"><b>${verdict}</b> ${md(s.q.why)}</div>`;
    } else {
      html += `<div class="qactions"><button class="btn" id="qReveal">Reveal <kbd>V</kbd></button><button class="btn" id="qSkip">Skip question</button></div>`;
    }
    html += `</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
  const rv = $('qReveal'); if (rv) rv.addEventListener('click', () => answer(-1));
  const sk = $('qSkip'); if (sk) sk.addEventListener('click', () => { state.answered.set(state.idx, -2); step(); });
  if (state.answered.get(state.idx) === -2) {
    // skipped: show nothing extra
  }
}

function renderStack(s) {
  const box = $('stack'), sc = state.sc;
  const prevIds = new Set((state.prevSnap ? state.prevSnap.stack : []).map(f => f.id));
  const frames = s.stack;
  const many = frames.length > 7;
  let html = '';
  if (sc.limit) {
    const d = s.depth;
    html += `<div class="limit"><div>Recursion limit: <b>${d} / ${sc.limit}</b> frames used (demo). Real Python allows about 1,000.</div><div class="bar"><i style="width:${Math.min(100, 100 * d / sc.limit)}%"></i></div></div>`;
  }
  for (let k = frames.length - 1; k >= 0; k--) {
    const f = frames[k], isTop = k === frames.length - 1;
    const compact = many && !isTop && k !== 0 && k < frames.length - 3;
    let cls = f.fn === '<module>' ? 'module ' : '';
    cls += f.status;
    if (compact) cls += ' compact';
    if (state.prevSnap && !prevIds.has(f.id) && f.fn !== '<module>') cls += ' new';
    let chip;
    if (f.fn === '<module>') chip = f.status === 'error' ? 'error' : isTop ? (state.idx === 0 ? 'ready' : 'done') : 'waiting';
    else if (f.status === 'active') chip = `running · line ${f.line}`;
    else if (f.status === 'waiting') chip = `paused · line ${f.line}`;
    else if (f.status === 'returning') chip = f.ret === null && f.implicit ? 'returns None' : `returns ${clip(pyrepr(f.ret), 16)}`;
    else chip = 'abandoned';
    let locals = '';
    for (const [n, v] of f.locals) {
      const isTmp = n.includes('(');
      const vtxt = v && v.__ref ? (v.__ref === '?' ? '? (waiting)' : '→ ' + v.__ref) : pyrepr(v);
      locals += `<span class="k ${isTmp ? 'tmp' : ''}">${esc(n)}</span><span class="v ${v && v.__ref ? 'ref' : ''}">${esc(clip(vtxt, 60))}</span>`;
    }
    const label = f.fn === '<module>' ? '&lt;module&gt;' : esc(f.label);
    const compactExtra = compact ? ` <span style="color:var(--muted);font-weight:400">${esc(f.locals.filter(l => !l[0].includes('(') && !(l[1] && l[1].__ref)).map(l => l[0] + '=' + clip(pyrepr(l[1]), 10)).join(' '))}</span>` : '';
    html += `<div class="frame ${cls}"><div class="fh"><span class="fname">${label}${compactExtra}</span><span class="chip">${esc(chip)}</span></div>` +
      (locals ? `<div class="locals">${locals}</div>` : '') + (f.note ? `<div class="fnote">${esc(f.note)}</div>` : '') + `</div>`;
  }
  box.innerHTML = html;
  box.scrollTop = 0;
  $('stackInfo').textContent = `${plural(s.depth, 'frame')} + <module>`;
}

function layoutTree(nodes) {
  const kids = nodes.map(() => []), roots = [];
  nodes.forEach(n => (n.parent === null ? roots.push(n.id) : kids[n.parent].push(n.id)));
  const pos = []; let leaf = 0, maxD = 0;
  const place = (id, d) => {
    maxD = Math.max(maxD, d);
    if (!kids[id].length) pos[id] = { x: leaf++, d };
    else { kids[id].forEach(c => place(c, d + 1)); pos[id] = { x: (pos[kids[id][0]].x + pos[kids[id][kids[id].length - 1]].x) / 2, d }; }
  };
  roots.forEach(r => place(r, 0));
  const longest = Math.max(4, ...nodes.map(n => n.short.length));
  const w = Math.min(200, longest * 8.2 + 18);
  return { pos, leaves: Math.max(1, leaf), maxD, w, colW: w + 16, rowH: 64, pad: 14 };
}

function renderViews(s) {
  const sc = state.sc, box = $('views');
  let html = '';
  for (const v of sc.views) html += `<div class="view">${VIEW[v](s)}</div>`;
  box.innerHTML = html;
  box.querySelectorAll('.tn').forEach(g => g.addEventListener('click', () => {
    const n = state.T.nodes[+g.dataset.id]; if (n) { stop(); go(n.at); }
  }));
  const views = sc.views.length;
  box.querySelectorAll('.treebox svg').forEach(svg => {
    const W = +svg.getAttribute('width'), H = +svg.getAttribute('height');
    const availW = box.clientWidth - 24, availH = box.clientHeight * (views > 1 ? 0.5 : 0.8);
    const scale = Math.min(1.8, availW / W, Math.max(1, availH / H));
    svg.style.width = Math.max(40, Math.floor(W * scale)) + 'px';
  });
  const act = box.querySelector('.tn.active, .tn.err');
  const tb = box.querySelector('.treebox');
  if (act && tb && tb.scrollHeight > tb.clientHeight + 4) {
    const r = act.getBoundingClientRect(), br = tb.getBoundingClientRect();
    if (r.top < br.top || r.bottom > br.bottom) tb.scrollTop += r.top - br.top - br.height / 2;
  }
  $('viewTitle').textContent = { tree: 'Recursion tree', array: 'The array', memo: 'Memo', pegs: 'Pegs', copies: 'Copies made' }[sc.views[0]];
}

const VIEW = {
  tree(s) {
    const L = state.layout, nodes = state.T.nodes, shown = s.nodes.length;
    const W = L.leaves * L.colW + 2 * L.pad, H = (L.maxD + 1) * L.rowH + 2 * L.pad;
    const cx = id => L.pad + L.pos[id].x * L.colW + L.colW / 2, cy = id => L.pad + L.pos[id].d * L.rowH;
    const prevShown = state.prevSnap ? state.prevSnap.nodes.length : 0;
    const onStack = new Set(s.stack.map(f => f.node).filter(x => x !== null && x !== undefined));
    let edges = '', ns = '';
    for (let i = 0; i < shown; i++) {
      const n = nodes[i], st = s.nodes[i];
      if (n.parent !== null) {
        const live = onStack.has(i) && onStack.has(n.parent);
        edges += `<path class="te ${live ? 'live' : ''}" d="M${cx(n.parent)},${cy(n.parent) + 26} C${cx(n.parent)},${cy(n.parent) + 46} ${cx(i)},${cy(i) - 20} ${cx(i)},${cy(i)}"/>`;
      }
      const cls = st.s + (st.rep ? ' rep' : '') + (i >= prevShown && state.prevSnap && i === shown - 1 ? ' fresh' : '');
      const ret = st.has ? (st.s === 'err' ? '✗ ' + st.r : '→ ' + clip(pyrepr(st.r), 20)) : '';
      ns += `<g class="tn ${cls}" data-id="${i}"><title>${esc(n.label)}</title>` +
        `<rect x="${cx(i) - L.w / 2}" y="${cy(i)}" width="${L.w}" height="26" rx="6"/>` +
        `<text class="l" x="${cx(i)}" y="${cy(i) + 17.5}" text-anchor="middle">${esc(clip(n.short, 24))}</text>` +
        (ret ? `<text class="r" x="${cx(i)}" y="${cy(i) + 42}" text-anchor="middle">${esc(ret)}</text>` : '') +
        (st.rep ? `<text class="rep" x="${cx(i) + L.w / 2 - 2}" y="${cy(i) - 3}" text-anchor="end">again</text>` : '') + `</g>`;
    }
    const legend = `<div class="legend"><span><i style="border-color:var(--accent);background:var(--accent-bg)"></i>running</span><span><i style="border-color:var(--wait);background:var(--wait-bg)"></i>paused (on the stack)</span><span><i style="border-color:var(--done);background:var(--done-bg)"></i>returned</span>` +
      (state.sc.repeats ? `<span><i style="border-color:var(--err);border-style:dashed"></i>repeat of earlier work</span>` : '') +
      (state.sc.id === 'fib_memo' ? `<span><i style="border-color:var(--hit);border-style:dashed;background:var(--hit-bg)"></i>looked up in memo</span>` : '') +
      (s.kind === 'err' || state.sc.limit ? `<span><i style="border-color:var(--err);background:var(--err-bg)"></i>abandoned</span>` : '') + `</div>`;
    return `<div class="vlabel"><span>Recursion tree</span><span class="meta">${shown} of ${nodes.length} calls drawn · click a node to jump to it</span></div>` +
      `<div class="treebox"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Recursion tree">${edges}${ns}</svg></div>` + legend;
  },
  array(s) {
    const arr = s.extra.arr; if (!arr) return '';
    const frames = s.stack.slice(1), top = frames[frames.length - 1];
    const ptr = {};
    frames.forEach(f => { const i = (f.locals.find(l => l[0] === 'i') || [])[1]; if (i !== undefined) (ptr[i] = ptr[i] || []).push(f === top && f.status !== 'error'); });
    let cells = '';
    const n = arr.length + (s.extra.oob ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const oob = i >= arr.length;
      const on = top && (top.locals.find(l => l[0] === 'i') || [])[1] === i;
      cells += `<div class="cell ${on ? 'on' : ''} ${oob ? 'oob' : ''}"><div class="ix">${i}</div><div class="bx">${oob ? '?' : arr[i]}</div><div class="ptr">${(ptr[i] || []).map(a => `<span class="p ${a ? 'a' : ''}">i</span>`).join('')}</div></div>`;
    }
    return `<div class="vlabel"><span>arr: one array, shared by every frame</span><span class="meta">len(arr) = ${arr.length}</span></div><div class="cells">${cells}</div>` +
      `<div class="legend"><span>Each frame has its own <code>i</code>. Highlighted: the running frame's <code>i</code>.</span></div>`;
  },
  memo(s) {
    const m = s.extra.memo, fl = s.extra.flash;
    if (!m) return `<div class="vlabel"><span>memo</span></div><div class="legend"><span>Not created yet: the first call makes it on line 3.</span></div>`;
    const cells = m.map((v, k) => `<div class="cell ${v === null ? 'none' : ''} ${fl && fl.k === k ? (fl.kind === 'hit' ? 'hitc' : 'set') : ''}"><div class="ix">${k}</div><div class="bx">${v === null ? 'None' : v}</div></div>`).join('');
    return `<div class="vlabel"><span>memo: one Array shared by every call</span><span class="meta">memo[k] holds fib(k)</span></div><div class="cells">${cells}</div>` +
      `<div class="legend"><span><i style="border-color:var(--done);background:var(--done-bg)"></i>just stored</span><span><i style="border-color:var(--hit);background:var(--hit-bg)"></i>just looked up</span></div>`;
  },
  pegs(s) {
    const P = s.extra.pegs, n = s.extra.ndisks, fl = s.extra.flash;
    const W = 420, H = 40 + n * 22 + 30, base = H - 26, xs = { A: 75, B: 210, C: 345 };
    let g = `<rect x="10" y="${base}" width="${W - 20}" height="6" rx="3" fill="var(--muted)"/>`;
    for (const p of ['A', 'B', 'C']) {
      g += `<rect x="${xs[p] - 3}" y="${base - n * 22 - 18}" width="6" height="${n * 22 + 18}" rx="3" fill="var(--muted)"/>`;
      g += `<text x="${xs[p]}" y="${H - 4}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${p}</text>`;
      P[p].forEach((d, k) => {
        const w = 34 + d * 26, y = base - (k + 1) * 22;
        const hot = fl && fl.disk === d && fl.d === p;
        g += `<rect x="${xs[p] - w / 2}" y="${y + 1}" width="${w}" height="20" rx="6" fill="${hot ? 'var(--accent)' : 'var(--wait-bg)'}" stroke="${hot ? 'var(--accent)' : 'var(--wait)'}" stroke-width="2"/>` +
             `<text x="${xs[p]}" y="${y + 16}" text-anchor="middle" font-size="13" font-weight="700" fill="${hot ? 'var(--panel)' : 'var(--wait)'}">${d}</text>`;
      });
    }
    const last = fl ? `Just moved: disk ${fl.disk}, ${fl.s} → ${fl.d}` : `${s.counters.moves || 0} of ${Math.pow(2, n) - 1} moves made`;
    return `<div class="vlabel"><span>Pegs</span><span class="meta">${last}</span></div><svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto;display:block;margin-inline:auto" role="img" aria-label="Hanoi pegs">${g}</svg>`;
  },
  copies(s) {
    const cs = s.extra.copies || [], fl = s.extra.flash;
    const rows = cs.map((c, k) => `<div class="copyrow ${fl && fl.k === k ? 'fresh' : ''}"><span class="lab">${k === 0 ? 'original' : 'copy ' + k}</span><div class="cells">${c.map(v => `<div class="cell"><div class="bx">${v}</div></div>`).join('')}</div></div>`).join('');
    return `<div class="vlabel"><span>Every slice is a new list</span><span class="meta">${s.counters.copied || 0} elements copied</span></div><div class="copies">${rows}</div>` +
      `<div class="legend"><span>The copies form a triangle: (n − 1) + (n − 2) + … + 1 = n(n − 1)/2 elements, O(n²).</span></div>`;
  },
};

function renderOut(s) {
  const prevLen = state.prevSnap && state.prevSnap !== s ? state.prevSnap.out.length : s.out.length;
  const forward = state.prevSnap && state.prevSnap.out.length <= s.out.length;
  $('out').innerHTML = s.out.map((o, i) => `<span class="${o.k} ${forward && i >= prevLen ? 'new' : ''}">${esc(o.t)}</span>`).join('\n');
  $('out').scrollTop = $('out').scrollHeight;
}

function renderTransport(s) {
  const N = state.T.steps.length;
  $('scrub').value = state.idx;
  $('pos').textContent = `step ${state.idx} / ${N - 1}`;
  $('bBack').disabled = state.idx === 0;
  $('bStep').disabled = $('bOver').disabled = $('bOut').disabled = state.idx >= N - 1;
  const c = s.counters, sc = state.sc;
  let html = `<span>Calls <b>${c.calls}</b></span><span>Depth <b>${s.depth}</b></span><span>Deepest <b>${c.maxDepth}</b></span>`;
  for (const k in (sc.counters || {})) html += `<span>${esc(sc.counters[k])} <b>${c[k] || 0}</b></span>`;
  $('stats').innerHTML = html;
  $('nudge').textContent = state.nudge;
}

/* ---------- controls ---------- */
function setTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('recursion-lab-theme', t || ''); } catch (e) {}
}
function wire() {
  $('bStep').addEventListener('click', () => { stop(); step(); });
  $('bBack').addEventListener('click', back);
  $('bOver').addEventListener('click', stepOver);
  $('bOut').addEventListener('click', stepOut);
  $('bPlay').addEventListener('click', play);
  $('bRestart').addEventListener('click', () => { stop(); go(0); });
  $('scrub').addEventListener('input', e => { stop(); go(+e.target.value); });
  $('bQuiz').addEventListener('click', () => {
    state.quiz = !state.quiz;
    $('bQuiz').innerHTML = `Questions: ${state.quiz ? 'on' : 'off'} <kbd>Q</kbd>`;
    $('bQuiz').classList.toggle('on', state.quiz);
    state.nudge = ''; renderNarr(); $('nudge').textContent = '';
  });
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark');
  });
  $('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.target.tagName === 'SELECT') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const s = snapAt(state.idx);
    if (s.q && state.quiz && !state.answered.has(state.idx)) {
      const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
      if (k in map && map[k] < s.q.choices.length) { e.preventDefault(); answer(map[k]); return; }
      if (k === 'v') { e.preventDefault(); answer(-1); return; }
    }
    if (k === 'arrowright' || k === ' ') { e.preventDefault(); stop(); step(); }
    else if (k === 'arrowleft') { e.preventDefault(); back(); }
    else if (k === 'o') stepOver();
    else if (k === 'u') stepOut();
    else if (k === 'p') play();
    else if (k === 'r') { stop(); go(0); }
    else if (k === 'e' || k === 'end') { stop(); go(state.T.steps.length - 1); }
    else if (k === 'q') $('bQuiz').click();
    else if (k === 'f') $('fsBtn').click();
  });
}

/* Self-check: open the page as recursion-lab.html#selftest to build every
   scenario with its default input and a few edge inputs. */
function selftest() {
  const lines = [];
  const extra = { factorial: [{ n: 0 }, { n: 1 }], factorial_neg: [{ n: 3 }], skip_base: [{ n: 4 }], forgot_return: [{ n: 0 }, { n: 1 }],
                  power: [{ x: 3, n: 0 }, { x: -2, n: 64 }], fib_memo: [{ n: 0 }, { n: 1 }, { n: 12 }], depth: [{ nested: [] }],
                  bs_wrong_base: [{ n: 0 }], binary_strings: [{ n: 0 }], flatten_str: [{ nested: [1, [2, [3]]] }], array_max: [{ arr: [7] }] };
  for (const sc of SCENARIOS) {
    const base = {}; for (const k in sc.params) base[k] = sc.params[k].def;
    for (const p of [base, ...(extra[sc.id] || []).map(e => Object.assign({}, base, e))]) {
      try {
        const T = build(sc, p);
        const last = T.out.slice(1).map(o => o.t.split('\n').pop()).join(' | ');
        const qs = T.steps.filter(x => x.q).length;
        const badLine = T.steps.some(x => x.line > sc.code.split('\n').length);
        state.sc = sc; state.T = T; state.layout = layoutTree(T.nodes); state.prevSnap = null;
        for (let i = 0; i < T.steps.length; i++) { state.prevSnap = state.idx < T.steps.length ? T.steps[state.idx] : null; state.idx = i; render(); }
        lines.push(`${sc.id} ${JSON.stringify(p)} steps=${T.steps.length} calls=${T.counters.calls} maxDepth=${T.counters.maxDepth} questions=${qs}${badLine ? ' BADLINE' : ''} :: ${last}`);
      } catch (e) { lines.push(`${sc.id} ${JSON.stringify(p)} CRASH ${e.message}`); }
    }
  }
  const pre = $('selftest'); pre.hidden = false; pre.textContent = lines.join('\n');
}

initPicker();
wire();
try { const t = localStorage.getItem('recursion-lab-theme'); if (t) setTheme(t); } catch (e) {}
let startId = 'factorial';
try { startId = localStorage.getItem('recursion-lab-scenario') || startId; } catch (e) {}
if (location.hash && location.hash.length > 1 && SCENARIOS.some(s => s.id === location.hash.slice(1))) startId = location.hash.slice(1);
loadScenario(startId);
if (location.hash === '#selftest') selftest();
</script>
